# Builds the WAPK forecast map data from ECMWF IFS open data and publishes it to the
# Cloudflare Pages project "wapk-forecast" (https://wapk-forecast.pages.dev).
#
# ECMWF publishes a new run four times a day (00Z and 12Z to 7 days, 06Z and 18Z to 90 h). This checks
# every hour and only rebuilds and deploys when a newer run is out, so most checks finish in under a minute.
# Each build takes the first 90 h from the newest run and the rest of the week from the newest full run.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  – a Cloudflare API token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID – e35f62e834050b6f12e9103657ebcb53 (Mashhood.droid@gmail.com's Account)
# and, for the written 7-day outlook (outlook.json; without it only its tables are published):
#   ANTHROPIC_API_KEY     – a Claude API key
name: Forecast map data

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and publish even if this ECMWF run is already live"
        type: boolean
        default: false
      target:
        description: "Pages branch: main is the live data site; preview (preview.wapk-forecast.pages.dev) is for testing"
        type: choice
        options: [main, preview]
        default: main

permissions:
  contents: read

concurrency:
  group: forecast-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The 0.1° surface download (about 2 GB) takes longer than the old 0.25° build.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline packages
        run: pip install -r pipeline/requirements.txt

      - name: Build forecast data (skipped if this run is already published)
        id: build
        run: python pipeline/build_forecast.py --out forecast-out ${{ (inputs.force || inputs.target == 'preview') && ' ' || '--published-url https://wapk-forecast.pages.dev/latest.json' }}

      # The 7-day outlook (pipeline/outlook): the site's weather rules for ~40 places, written up by Claude.
      # A failure here never blocks the map data.
      - uses: actions/setup-node@v5
        if: steps.build.outputs.changed == 'true'
        with:
          node-version: "22"

      - name: Write the 7-day outlook
        if: steps.build.outputs.changed == 'true'
        continue-on-error: true
        timeout-minutes: 15
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm ci --prefix pipeline/outlook --no-audit --no-fund
          node pipeline/outlook/build_outlook.mjs forecast-out

      - name: Publish to Cloudflare Pages
        if: steps.build.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.98.0 pages deploy forecast-out --project-name wapk-forecast --branch ${{ inputs.target || 'main' }} --commit-dirty=true
