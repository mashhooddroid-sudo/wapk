# Builds the WAPK forecast map data from ECMWF IFS open data and publishes it to the
# Cloudflare Pages project "wapk-forecast" (https://wapk-forecast.pages.dev).
#
# ECMWF publishes a new run four times a day. This checks every 3 hours and only rebuilds and
# deploys when a newer run is out, so most runs finish in under a minute.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  – a Cloudflare API token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID – e35f62e834050b6f12e9103657ebcb53 (Mashhood.droid@gmail.com's Account)
name: Forecast map data

on:
  schedule:
    - cron: "25 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forecast-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline packages
        run: pip install -r pipeline/requirements.txt

      - name: Build forecast data (skipped if this run is already published)
        id: build
        run: python pipeline/build_forecast.py --out forecast-out --published-url https://wapk-forecast.pages.dev/latest.json

      - name: Publish to Cloudflare Pages
        if: steps.build.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.98.0 pages deploy forecast-out --project-name wapk-forecast --branch main --commit-dirty=true
